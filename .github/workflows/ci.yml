name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded branch runs are cancelled; main runs are kept so every commit
# keeps its own status. Three pushes to main landed inside 33 minutes on
# 2026-08-18 and each one started a fresh 6 hour hang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge
          sudo apt-get clean
          df -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test -- --nocapture 2>&1 | tee cargo-test.log
      - name: Report tests that skipped for a missing fixture
        # Some tests need data this repository does not carry, so they skip
        # rather than fail. A skip reports `ok`, which means a green run can
        # hide a suite that quietly shrank. This does not fail the build; it
        # prints the count and the names so a shrinking suite is visible in the
        # log instead of invisible in a pass. tests/common/mod.rs emits the
        # marker, and OO_REQUIRE_FIXTURES=1 turns each skip into a failure for
        # any job that is supposed to supply the fixtures.
        #
        # `shell: bash` because the matrix includes Windows, where a `run:`
        # block defaults to PowerShell and this one is a bash script. It failed
        # the whole Windows leg on the line it was written to be harmless on,
        # contradicting the "does not fail the build" above. The runner ships
        # bash, so naming it is the whole fix.
        shell: bash
        run: |
          n=$(grep -c 'SKIPPED_FIXTURE:' cargo-test.log || true)
          echo "$n test(s) skipped for a missing fixture"
          grep 'SKIPPED_FIXTURE:' cargo-test.log | sort -u || true
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Audit
        run: |
          # --locked installs cargo-audit with its own published Cargo.lock.
          # Without it cargo resolves transitive deps to latest, and
          # tinyvec 1.13.0 no longer compiles on current stable
          # ("`vec` is imported here, but it is a module, not a macro"),
          # so the audit step fails for a reason unrelated to this repo.
          cargo install cargo-audit --locked
          cargo audit

  # Windows is the only leg that rejects an unrepresentable path, and it rejects
  # it inside actions/checkout, before a line is compiled: `benchmark/lubm\Uni-
  # versity0_0.owl` is one file on Linux and macOS and an invalid path on
  # Windows, so git exits 128 and cancels the rest of the matrix. That is how
  # 190 generated LUBM files rode in on #100 while every local `git status`
  # stayed clean and the failure surfaced as an unexplained build break. This
  # job names the offending paths in seconds.
  paths:
    timeout-minutes: 10
    name: paths / windows-safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject paths Windows cannot check out
        run: |
          bad=$(git ls-files -z | tr '\0' '\n' \
            | grep -Ei '\\|[:?*<>"|]|[ .]$|(^|/)(con|prn|aux|nul|com[1-9]|lpt[1-9])(\.|$)' || true)
          if [ -n "$bad" ]; then
            echo "Tracked paths that actions/checkout will reject on Windows:"
            echo "$bad"
            exit 1
          fi
          echo "All tracked paths are representable on Windows."

  # Optional features are compiled by nothing above: `default = []`, and the
  # three cargo invocations in `build` are bare. A green run there says nothing
  # about postgres, duckdb, sql, embeddings or causal-pywhy, nor about the
  # dependency trees they pull in (sqlx, duckdb, tract-onnx, tokenizers,
  # instant-distance).
  #
  # It is also why eight test files under tests/ had never been collected once.
  # tests/schema_test.rs is gated on `postgres` and covers
  # SchemaIntrospector::sql_to_xsd, which carried a real defect the whole time
  # (#76, fixed in #80): the test existed, and it was dark.
  #
  # Ubuntu only. The bundled duckdb build dominates wall time and Windows would
  # double it for no signal the Linux leg does not already give.
  features:
    timeout-minutes: 45
    name: features / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Breadth: everything compiles and lints, including causal-pywhy,
          # whose Rust side has no dependencies of its own.
          - name: breadth (all-features)
            cache_key: breadth
            flags: --all-features
            test: false
          # Depth: everything whose tests run without external services.
          # causal-pywhy is left out here rather than everywhere — it shells out
          # to Python/DoWhy at runtime, which is a service dependency in all but
          # name. It is still compiled and linted by the breadth leg.
          # `turbovec` belongs in this leg rather than only in the breadth
          # leg, because breadth is `test: false`. Without it here the
          # TurboQuant backend and the text-vector eviction mode are compiled
          # and linted by CI but never once executed by it.
          - name: depth (postgres,duckdb,embeddings,sql,turbovec)
            cache_key: depth
            flags: --features postgres,duckdb,embeddings,sql,turbovec
            test: true
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/edge
          sudo apt-get clean
          df -h
      - name: Install build deps (OpenSSL/libpq)
        # The runner image already ships all three of these, so the common case
        # is a no-op: the step logged "0 upgraded, 0 newly installed" every time
        # it succeeded. Its only real effect was an unconditional network call.
        # On 2026-08-18 the Azure apt mirror went dark, apt fell back to
        # archive.ubuntu.com, stalled mid-transfer, and sat there with no
        # timeout until GitHub killed the job at the 6 hour ceiling (runs
        # 32156117278 and 32157458411, 5h58m of silence after the last Get:).
        # So: touch the network only when something is genuinely missing, and
        # bound apt when it is.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          missing=()
          for p in pkg-config libssl-dev libpq-dev; do
            dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "Build deps already present on the image; skipping apt."
            exit 0
          fi
          echo "Missing build deps: ${missing[*]}"
          sudo apt-get -o Acquire::Retries=3 \
                       -o Acquire::http::Timeout=30 \
                       -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
                       --no-install-recommends "${missing[@]}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed per leg: they build disjoint dependency trees, and sharing one
          # cache between them would thrash it on every run. Not `matrix.name` —
          # GitHub rejects cache keys containing commas, and the rejection is a
          # log annotation rather than a failing step, so the leg would keep
          # running uncached and silent.
          key: ${{ matrix.cache_key }}
      - name: Check
        run: cargo check ${{ matrix.flags }} --all-targets
      - name: Clippy
        # --all-targets so the gated tests are linted too. `-D warnings` over
        # code that is never compiled is not a check.
        run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings
      - name: Test
        if: matrix.test
        run: |
          set -o pipefail
          cargo test ${{ matrix.flags }} 2>&1 | tee cargo-test.log
      - name: Verify every enabled test file collected tests
        if: matrix.test
        # Same flags as the test step, so the enabled set cannot drift from what
        # was actually built. The script expands them through [features], which
        # a hand-written list would not: `sql` implies postgres + duckdb.
        run: bash scripts/check-test-collection.sh cargo-test.log "${{ matrix.flags }}"

  # The README describes the SHACL validator as differentially tested against
  # pyshacl. tools/shacl_differential.py has existed since August and was
  # referenced by no workflow and no Makefile target, so nothing ran it, no
  # result was ever committed, and the claim rested on a run somebody did once
  # by hand. A verification procedure nobody executes is the same defect as a
  # test that returns early: it reports assurance that did not happen.
  #
  # The oracle exits 1 on a FALSE_CLEAN, meaning we said conforms where pyshacl
  # said not, which is the one failure this validator must never have. That is
  # what gates here. Disagreements in the other direction and undetermined
  # verdicts are printed and uploaded, not failed on, because they are a work
  # list rather than a defect.
  shacl-differential:
    timeout-minutes: 30
    name: SHACL differential vs pyshacl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyshacl
        run: pip install pyshacl
      - name: Build the binary the oracle drives
        run: cargo build --release
      - name: Run the differential over the case-study corpus
        run: |
          python3 tools/shacl_differential.py \
            --discover case-studies \
            --json shacl-differential.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shacl-differential
          path: shacl-differential.json

  # `python/` (open-ontologies-lite) has its own test suite and its own release
  # workflow, and until now nothing ran the tests. `python-release.yml` goes
  # straight from `uv build` to `pypa/gh-action-pypi-publish` on a `py-v*` tag,
  # so every wheel published to PyPI so far was published without its tests
  # having executed once. Same shape of gap as #67, one subpackage over.
  #
  # Kept in CI rather than bolted onto the release workflow: a test that only
  # runs at publish time tells you about the defect after the artefact is
  # public.
  python:
    timeout-minutes: 15
    name: python (open-ontologies-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # the floor declared by requires-python
      - name: Install with dev extras
        working-directory: python
        run: uv pip install --system -e ".[dev]"
      - name: Test
        working-directory: python
        run: python -m pytest -q

  # Nothing built, type-checked or linted `studio/` before this, so a green tick
  # on a PR that only touched Studio said nothing whatsoever about it (#64 is
  # exactly that PR).
  #
  # `tsc --noEmit` rather than `npm run build`: the build script chains
  # `vite build && npm run prepare-engine`, and prepare-engine stages the Rust
  # binary, which would make this job depend on a release build of the whole
  # crate. Type-checking is the part that catches the errors a reviewer cannot
  # see by reading a diff.
  studio:
    timeout-minutes: 15
    name: studio (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install
        working-directory: studio
        run: npm ci
      - name: Type-check
        working-directory: studio
        run: npx tsc --noEmit

  # The Lean certificate layer. `lean/` holds a checker for the reasoner's
  # derivation certificates with a machine-checked soundness proof. Building
  # that directory IS the proof check: the `#guard_msgs` axiom tripwire in
  # OOCert/Soundness.lean fails the build on any `sorry`. The Rust test then
  # certifies every ontology this repository ships through the built checker
  # and proves the checker can also say no. OO_REQUIRE_FIXTURES=1 turns the
  # "no lake installed" skip into a failure, so this job cannot pass by not
  # running.
  #
  # The last three legs are the SAT/SMT family: a model finder proposes a
  # finite structure and `oo-folmodel` disposes. They need z3 and mace4 as well
  # as Lean, and the same environment variable turns a missing solver from a
  # loud skip into a failure here, for the same reason.
  lean:
    timeout-minutes: 45
    name: lean / certificate checker
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
          use-github-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Certify every shipped ontology through the proved checker
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_certificate_test -- --nocapture
      - name: Check the verified SHACL Core evaluator against the W3C suite
        # This job used to run a bare `lake build` while `Shacl` was not a
        # default target, so the SHACL proofs did not compile at the commit
        # that carried them and this gate was green over them. The lakefile now
        # forces every target into the default set and this step measures the
        # verified evaluator, so both halves of that failure are closed.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test shacl_core_verified_test -- --nocapture
      - name: Check the description-logic model certificates
        run: OO_REQUIRE_FIXTURES=1 cargo test --test dl_model_certificate_test -- --nocapture
      - name: Check the refutation certificates
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_refutation_test -- --nocapture
      - name: Check the refutations THIS ENGINE writes, and that it cannot refute a consistent ontology
        # The line above checks hand-written fixtures, which settles whether the
        # checker works and says nothing about whether anything can feed it.
        # This one runs the engine, takes its `refutation.tsv`, and hands that
        # to the same binary. The two legs that matter most are the consistent
        # ontology, where no refutation may be produced and none may be
        # accepted, and the laundering guard, which fails if this engine ever
        # states the verdict only an accepted refutation earns.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_refutation_producer_test -- --nocapture
      - name: Check the mixed certificate layer
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_mixed_certificate_test -- --nocapture
      - name: Check the generic Horn-rule layer, and that a user rule cannot earn the absolute verdict
        # The five legs here are not interchangeable. Four of them prove the
        # checker rejects a specific forgery; the fifth proves that a
        # certificate over rules the user supplied reports a DIFFERENT verdict
        # from one over the built-ins. That last one is the difference between
        # a verification layer and a device for laundering an assumption into a
        # fact, and it is the reason this job exists rather than being folded
        # into the line above.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_horn_certificate_test -- --nocapture
      - name: Install the model finders
        # Z3 reads SMT-LIB and is the only one of the two that can be asked the
        # UNBOUNDED question, which is the only route to `unsatisfiable_oracle`.
        # Mace4 ships in the LADR/Prover9 distribution: Prover9's refutations
        # are uncheckable and by decision 0005 an oracle opinion for ever, but
        # Mace4 is a FINITE MODEL FINDER and a finite model is exactly what
        # this layer certifies. The dead toolchain has a live half.
        # `prover9` has no installation candidate on Ubuntu noble, which is what
        # broke this job the first time it ran on main. LADR is built from the
        # maintained fork instead, pinned to a commit, with -std=gnu89 because
        # the source is K&R C and a current compiler otherwise rejects its
        # implicit-int parameters as errors. The recipe was run locally before
        # it was committed here. Only mace4 is installed: Prover9 itself is not
        # used anywhere, by decision 0005.
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y z3
          git clone -q https://github.com/laitep/ladr.git /tmp/ladr
          git -C /tmp/ladr checkout -q 8317cb2dea069cd57723f76bdee7d6bd818103a7
          # Build ONLY the library and mace4. LADR's top-level `all` also builds
          # prover9, whose link rule puts -lm before the objects that need it;
          # GNU ld resolves libraries left to right, so that link fails on
          # Linux while macOS's linker, which ignores order, let it pass
          # locally. mace4.src is built before provers.src in that `all`, and
          # the first run on main showed mace4 had already linked when prover9
          # failed. Nothing here uses prover9, so nothing here builds it.
          make -C /tmp/ladr/ladr lib XFLAGS="-std=gnu89" > /tmp/ladr-build.log 2>&1 || { tail -30 /tmp/ladr-build.log; exit 1; }
          make -C /tmp/ladr/mace4.src all XFLAGS="-std=gnu89" >> /tmp/ladr-build.log 2>&1 || { tail -30 /tmp/ladr-build.log; exit 1; }
          sudo install -m 755 /tmp/ladr/bin/mace4 /usr/local/bin/mace4
          command -v z3 mace4
      - name: Check the first-order model certificates end to end
        # `lake build` already compiles these proofs, because `Fol` and
        # `oo-folmodel` are both in defaultTargets. What this leg adds is the
        # ENGINE's own export going through a real solver and back into the
        # verified checker, which is what decision 0006 recorded as missing.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_fol_model_test -- --nocapture
      - name: Check that an unchecked result never reports the certified word
        # The laundering guard, and the reason this is its own leg rather than
        # folded into the line above. A pipeline that fell back to
        # `model_checked` when the checker was unavailable would print the
        # certified word on every machine without Lean installed, and a run
        # whose bounded search was exhausted must say `no_model_up_to_size_k`
        # and never `unsatisfiable_oracle`. See docs/decisions/0006 item 4.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test fol_solver_verdict_test -- --nocapture
      - name: Check the model ingestion, both front ends
        run: OO_REQUIRE_FIXTURES=1 cargo test --test fol_model_ingest_test -- --nocapture
      - name: Check that a projection preserves the claims an answer rests on
        # Coverage is a proxy, and the first two legs here are the argument for
        # that sentence: a slice of a SHIPPED ontology at coverage 1.0 with
        # ok:true that has dropped the one triple the answer depends on, and
        # its converse at coverage 0.001 preserving every claim with a
        # Lean-checked certificate. The rest are the verdict discipline and the
        # three conditions under which the monotonicity gate is disarmed.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test lean_projection_entailment_test -- --nocapture
      - name: Check the goal-free closure diff
        run: OO_REQUIRE_FIXTURES=1 cargo test --test closure_diff_test -- --nocapture
      - name: Run the monotonicity differential over every shipped ontology
        # OWL RL is monotone and a projection is a subset, so anything the
        # projection entails and the source does not is a soundness bug in the
        # engine. This leg runs that check for real over the shipped corpus and
        # prints what it found, INCLUDING if it found nothing: a sweep whose
        # gate was disarmed everywhere establishes nothing, so the test fails
        # if the gate was armed on fewer than half the ontologies.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test projection_monotonicity_corpus_test -- --nocapture
      - name: Check the preserve and closure-diff command lines, including their exit codes
        # Wiring nothing exercises is how `push` came to be proxied to a batch
        # runner with no arm for it. These run the real binary, and they pin
        # that a lost claim fails the process rather than printing a finding
        # and exiting 0.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test preserve_cli_test -- --nocapture
      - name: Show every gate firing on its own broken input
        # A gate that cannot fail is decoration, and a gate whose failure
        # nobody has read is close to it. This leg feeds each gate the input
        # built to trip it and PRINTS what the tool said, so the evidence is in
        # the job log rather than in a doc.
        run: OO_REQUIRE_FIXTURES=1 cargo test --test gate_demonstration_test -- --nocapture

  # The official W3C SHACL test suite, as a ratchet.
  #
  # `shacl-differential` above compares this engine against pyshacl on OUR
  # corpus, which measures agreement with one other implementation on data we
  # chose. This measures conformance against the Working Group's own suite on
  # data they chose, which is the only number that can be quoted outside this
  # repository. The two are complementary and neither replaces the other.
  #
  # The gate is monotone, not pass-all: PASS may not drop, FAIL may not rise,
  # and no named PASS may regress against tests/w3c_shacl_baseline.json. The
  # engine passes 32 of 120 today and pretending otherwise would be exactly the
  # silent success this repository keeps finding elsewhere. See the module docs
  # in tests/w3c_shacl_conformance_test.rs.
  #
  # Cheap by construction: no Python, no network, no release build. The suite is
  # vendored under tests/w3c-shacl/ (632 KB, W3C Software and Document License)
  # so the job is offline and deterministic. OO_REQUIRE_FIXTURES=1 turns the
  # "suite missing" skip into a failure, so it cannot pass by not running.
  w3c-shacl:
    timeout-minutes: 15
    name: SHACL conformance vs the W3C suite
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the suite and hold the ratchet
        run: |
          set -o pipefail
          OO_REQUIRE_FIXTURES=1 cargo test --test w3c_shacl_conformance_test -- --nocapture \
            2>&1 | tee w3c-shacl-conformance.log
      - name: Upload the per-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-shacl-conformance
          path: w3c-shacl-conformance.log
