[advisories]
ignore = [
    # rand unsoundness with custom logger — transitive dep from tokenizers, rmcp, tract-onnx
    # We don't use rand::rng() directly or custom loggers. Waiting on upstream fixes.
    "RUSTSEC-2026-0097",
    # quick-xml denial of service advisories, both patched in 0.41.0. This
    # project's direct dependency is still quick-xml 0.37 (see Cargo.toml), and
    # Cargo.lock resolves exactly one quick-xml, version 0.37.5, shared by that
    # direct dependency, calamine 0.30.1, and oxigraph's oxrdfxml 0.2.3 and
    # sparesults 0.3.3. Bumping the direct pin on its own would not clear the
    # advisory, because every published oxrdfxml and sparesults release still
    # requires quick-xml "0.37", so the 0.37.5 lockfile entry stays until
    # upstream oxigraph moves. calamine is the one dependency here that can
    # move now, because calamine 0.36 requires quick-xml "0.41".
    # Our own call site is Ingest::parse_xml in src/ingest.rs, which uses a
    # plain quick_xml Reader and never constructs an NsReader or calls
    # attributes(), so it falls outside the affected code paths of both
    # advisories. The oxigraph RDF/XML path falls inside them, because oxrdfxml
    # parses with NsReader and iterates start tag attributes, and that path is
    # reachable from third-party input: src/marketplace.rs accepts the "rdfxml"
    # format for community packs fetched over HTTP, and src/server.rs loads
    # that fetched content into the store. The risk accepted here is
    # availability only, and the HTTP transport binds 127.0.0.1 by default.
    # Remove these entries once oxrdfxml and sparesults publish releases built
    # on quick-xml 0.41 or later.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rkyv 0.7.46 out-of-bounds reads on archives containing Rc/Arc.
    # Not compiled by this project in any configuration. rkyv is an OPTIONAL
    # dependency of rust_decimal (rust_decimal-1.42.1/Cargo.toml: `rkyv =
    # ["dep:rkyv"]`), reaching us only via duckdb -> rust_decimal, and duckdb
    # does not enable that feature. Verified: `cargo tree --all-features
    # --target all -i rkyv` returns no results, while `-i rust_decimal` shows
    # rust_decimal -> duckdb -> open-ontologies. cargo audit reads Cargo.lock,
    # which records optional dependencies the compiler never sees.
    # Unfixable by version bump: the advisory requires >= 0.8.17, but
    # rust_decimal requires rkyv "0.7.46", which Cargo reads as at least 0.7.46
    # and below 0.8.0, and it has not migrated to the 0.8
    # line (it carries a separate rkyv-0_8 dev-dependency). Remove this entry
    # once rust_decimal ships a release depending on rkyv 0.8.
    "RUSTSEC-2026-0235",
]
